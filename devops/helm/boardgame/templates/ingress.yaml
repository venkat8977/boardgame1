apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: boardgame-ingress
spec:
  ingressClassName: nginx
  rules:
    - host: {{ .Values.ingress.host }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: boardgame-svc
                port:
                  number: {{ .Values.service.port }}