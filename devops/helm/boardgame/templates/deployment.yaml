apiVersion: apps/v1
kind: Deployment
metadata:
  name: boardgame
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      app: boardgame
  template:
    metadata:
      labels:
        app: boardgame
    spec:
      containers:
        - name: boardgame
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          ports:
            - containerPort: {{ .Values.service.targetPort }}